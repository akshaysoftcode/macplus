version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: changeme123
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./app-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://appuser:changeme123@db:5432/appdb
      JWT_SECRET: local-dev-only-secret
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./app-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
