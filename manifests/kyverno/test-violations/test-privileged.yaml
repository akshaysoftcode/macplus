apiVersion: v1
kind: Pod
metadata:
  name: test-privileged
  labels:
    test: kyverno-violation
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      resources:
        limits:
          memory: "128Mi"
          cpu: "100m"
      securityContext:
        runAsNonRoot: true
        privileged: true   # VIOLATION: should be denied
