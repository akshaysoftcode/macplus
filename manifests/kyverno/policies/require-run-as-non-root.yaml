apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/description: >-
      A container running as root, combined with any container-breakout
      vulnerability, gives an attacker root on the host - the difference
      between a contained incident and a cluster-wide one. This is
      exactly the property app-api's and app-frontend's hardened
      Dockerfiles already provide (distroless :nonroot, nginx-unprivileged)
      - this policy makes it a cluster-enforced guarantee, not just a
      Dockerfile convention someone could quietly drop later.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must run as non-root: set runAsNonRoot: true at the pod or container securityContext level."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
